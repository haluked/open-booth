<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Chamber Not Found | OpenBooth</title>
  <meta name="description" content="The photobooth room or page you requested could not be found or has expired.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="/assets/favicon.png">

  <style>
    @font-face {
      font-family: 'Fragile Bombers';
      src: url('/fonts/fragile-bombers/FragileBombers.otf') format('opentype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Hooey Demo';
      src: url('/fonts/hooey-demo/HooeyDEMO-Regular.otf') format('opentype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Alucrads';
      src: url('/fonts/alucrads/Alucrads.otf') format('opentype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Granix';
      src: url('/fonts/granix/Granix-Demo.otf') format('opentype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Sunny Brunch';
      src: url('/fonts/sunny-brunch/sunny-brunch.regular.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'BlueScreen';
      src: url('/fonts/bluescreen/BlueScreen.ttf') format('truetype');
      font-display: swap;
    }

    body {
      font-family: 'Granix', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      color: #f1f5f9;
      background-color: #0c0e12;
      background-image: radial-gradient(circle at 50% 20%, #151821 0%, #0b0d12 100%);
    }

    .font-alucrads { font-family: 'Fragile Bombers', 'Impact', monospace; }
    .font-bombers { font-family: 'Fragile Bombers', 'Impact', monospace; }
    .font-hooey { font-family: 'Hooey Demo', monospace; }
    .font-granix { font-family: 'Granix', sans-serif; }
    .font-hud { font-family: 'Sunny Brunch', 'BlueScreen', monospace; }

    .aero-bar {
      background: rgba(11, 15, 25, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
    }

    .shimmer-btn {
      position: relative;
      overflow: hidden;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
    }
    .shimmer-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transform: rotate(25deg);
      transition: left 0.6s ease;
    }
    .shimmer-btn:hover::after {
      left: 140%;
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-center items-center px-4 selection:bg-cyan-400 selection:text-black antialiased relative overflow-hidden">

  <!-- 404 Modal Chamber -->
  <main class="relative z-10 max-w-md w-full aero-bar rounded-3xl p-8 sm:p-10 border border-cyan-500/40 text-center flex flex-col items-center gap-6 shadow-[0_20px_60px_rgba(0,0,0,0.9)]">
    
    <header class="flex flex-col items-center gap-3">
      <img src="/assets/better_header.png" alt="OPEN//BOOTH" width="220" height="36" class="h-9 w-auto object-contain drop-shadow-[0_4px_16px_rgba(6,182,212,0.25)]">
      <span class="text-[11px] font-hud tracking-widest uppercase text-cyan-400 px-3 py-1 rounded-full bg-cyan-950/80 border border-cyan-500/30">
        ERROR // 404
      </span>
    </header>

    <div class="flex flex-col items-center gap-2">
      <h1 class="text-6xl sm:text-7xl font-alucrads font-black text-white tracking-wider leading-none">
        404
      </h1>
      <h2 class="text-sm sm:text-base font-granix font-bold text-slate-200 uppercase tracking-widest mt-1">
        Chamber Not Found
      </h2>
      <p class="text-xs font-hud text-slate-400 max-w-xs mt-2 leading-relaxed">
        This room code does not exist, has expired, or is no longer connected to signaling orbit.
      </p>
    </div>

    <div class="w-full pt-4 border-t border-white/10 flex flex-col gap-3">
      <a href="/" class="shimmer-btn w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-granix font-black text-xs uppercase py-3.5 px-6 rounded-xl transition-all shadow-[0_0_24px_rgba(6,182,212,0.4)] text-center block">
        RETURN TO LOBBY
      </a>
      <span class="text-[10px] font-hud text-slate-500">OPENBOOTH • 2-PLAYER RETRO PROTOCOL</span>
    </div>

  </main>
</body>
</html>
